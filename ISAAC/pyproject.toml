[project]
authors = [
  {name = "Your Name", email = "you@example.com"},
]
dependencies = [
  "ultralytics (>=8.3.143,<9.0.0)",
  "pre-commit (>=4.2.0,<5.0.0)",
  "ncnn (>=1.0.20250503,<2.0.0)",
  "opencv-contrib-python (>=4.11.0.86,<5.0.0.0)",
  "logging (>=0.4.9.6,<0.5.0.0)",
  "colorlog (>=6.9.0,<7.0.0)",
  "pydantic-settings (>=2.9.1,<3.0.0)",
  "cryptography (>=45.0.4,<46.0.0)",
  "mlflow (>=2.5.0,<3.0.0)",
]
description = ""
name = "isaac-cvmod"
readme = "README.md"
requires-python = ">=3.12,<3.14"
version = "0.1.0"

[tool.poetry]
packages = [
  {include = "src"},
]

[tool.poetry.group.dev.dependencies]
fastapi = "^0.115.12"
pytest = "^8.3.5"
pytest-httpserver = "^1.1.3"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
lint.extend-select = ["D", "FAST", "DOC"] # Enable docstring checks (D-series)
lint.ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D203",
  "D213",
  "D102",
  "D107", # Missing docstring in __init__.py
  "D106", # Missing docstring in public method
]

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]
